version: "1.0"
timezone: Europe/Bratislava
seen_window_hours: 48
radar_window_hours: 24
synthesis_window_hours: 6
recent_theme_window_hours: 4
max_radar_items: 180
max_llm_items: 45
top_story_count: 5
max_europe_now: 2
schedule_bands:
  weekday:
    - start: "05:30"
      end: "08:30"
      every_minutes: 20
    - start: "08:30"
      end: "18:00"
      every_minutes: 10
    - start: "18:00"
      end: "23:50"
      every_minutes: 20
  weekend:
    - start: "05:30"
      end: "22:00"
      every_minutes: 20
models:
  gemini: gemini-2.5-flash-lite
  openrouter:
    # OpenRouter's free-only router. Never replace this with a paid model ID.
    - openrouter/free
