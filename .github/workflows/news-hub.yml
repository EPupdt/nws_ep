name: Europe Pulse News Hub

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: europe-pulse-news-hub
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect and select
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OR_API_KEY: ${{ secrets.OR_API_KEY }}
          PYTHONPATH: src
        run: python -m news_hub.main
      - name: Commit generated operational data
        run: |
          git config user.name "Europe Pulse News Agent"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data public
          git diff --cached --quiet || git commit -m "chore: update news hub output"
          git pull --rebase origin main
          git push
