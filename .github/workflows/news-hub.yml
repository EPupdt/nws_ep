name: Europe Pulse News Hub

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass the Europe/Bratislava collection schedule"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: europe-pulse-news-hub
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    # The external cron-job.org trigger is the only scheduler. Leave headroom
    # for slow publisher feeds while the collector itself has bounded requests.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect and select
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OR_API_KEY: ${{ secrets.OR_API_KEY }}
          PYTHONPATH: src
          # External dispatches wake the workflow but retain the editorial schedule.
          # Select "force" only for an intentional immediate manual refresh.
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force == 'true' }}
        run: python -m news_hub.main
      - name: Commit generated operational data
        run: |
          git config user.name "Europe Pulse News Agent"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "chore: update news hub output"
          git pull --rebase origin main
          git push
